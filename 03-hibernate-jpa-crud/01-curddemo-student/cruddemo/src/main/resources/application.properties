spring.application.name=cruddemo

spring.datasource.url=jdbc:mariadb://localhost:3306/student_tracker
spring.datasource.username=springstudent
spring.datasource.password=springstudent

# Apagar banner de Spring Boot
spring.main.banner-mode=off

# Mostrar solo advertencias y errores en los logs
logging.level.root=warn

# Agregar configuración de logs para mostrar sentencias SQL
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Configurar JPA/Hibernate para autogenerar las tablas en la base de datos
spring.jpa.hibernate.ddl-auto=create
